name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-functions:
    name: Build Firebase Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Build
        working-directory: functions
        run: |
          npm run build
          npm run lint

      - name: Check model publisher
        working-directory: functions
        run: |
          npm run model:check
          node --check scripts/set-training-threshold.mjs
          node --check scripts/has-queued-training.mjs
          node --check scripts/export-training-corpus.mjs

      - name: Check remote trainer
        run: |
          python3 -m py_compile trainer/model.py trainer/rhythm.py trainer/retrain.py trainer/validation.py
          python3 -m unittest discover -s trainer -p 'test_*.py'
          test -s trainer/seed/beatbox_classifier.pth
