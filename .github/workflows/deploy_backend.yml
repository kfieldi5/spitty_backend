name: Deploy Firebase backend

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase backend and Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPITTY_BACKEND }}"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SPITTY_BACKEND"
            echo "Add it to the spitty_backend repository secrets as the raw Google service-account JSON."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs = require('fs'); const json = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!json.client_email || !json.private_key) throw new Error('Service account JSON must include client_email and private_key'); console.log('Using Firebase service account:', json.client_email);" "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy backend targets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase --version
          firebase deploy \
            --project spitty-backend \
            --only functions,firestore:rules,storage,hosting \
            --force \
            --non-interactive
